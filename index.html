
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ワクワク！クイズチャレンジ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Arial", "Hiragino Kaku Gothic ProN", sans-serif;
      color: #292344;
      background: linear-gradient(135deg, #ffe1ec, #d9f5ff, #fff0bd);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: rgba(255, 255, 255, 0.94);
      padding: 36px 28px;
      border-radius: 28px;
      box-shadow: 0 12px 35px rgba(65, 48, 100, 0.15);
      text-align: center;
    }

    .label {
      display: inline-block;
      background: #ffdeea;
      color: #e84e8a;
      border-radius: 20px;
      padding: 7px 16px;
      font-size: 13px;
      font-weight: bold;
    }

    h1 {
      font-size: clamp(27px, 6vw, 42px);
      margin: 18px 0 12px;
      color: #6845c5;
    }

    .description {
      color: #6d6880;
      line-height: 1.8;
    }

    .emoji {
      font-size: 68px;
      margin: 22px 0;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      transition: transform 0.2s, opacity 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      opacity: 0.88;
    }

    .main-button {
      background: linear-gradient(90deg, #ff6eaa, #a16bff);
      color: white;
      font-size: 18px;
      font-weight: bold;
      padding: 16px 32px;
      border-radius: 50px;
      box-shadow: 0 6px 15px #d8b6f5;
      margin-top: 14px;
    }

    #quiz {
      display: none;
      margin-top: 28px;
      text-align: left;
    }

    .progress {
      color: #8b78c5;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    #question {
      font-size: 22px;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    .choices {
      display: grid;
      gap: 12px;
    }

    .choice {
      width: 100%;
      text-align: left;
      padding: 16px;
      border: 2px solid #e7ddff;
      border-radius: 15px;
      background: #faf8ff;
      color: #38304f;
      font-size: 16px;
    }

    .choice:disabled {
      cursor: default;
    }

    .choice.correct {
      background: #d9f9e8;
      border-color: #48c78e;
    }

    .choice.wrong {
      background: #ffe0e8;
      border-color: #ff7196;
    }

    #feedback {
      font-weight: bold;
      line-height: 1.8;
      margin-top: 20px;
      white-space: pre-line;
    }

    #nextButton {
      display: none;
      width: 100%;
      background: #6845c5;
      color: white;
      border-radius: 14px;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 18px;
    }

    #result {
      display: none;
      margin-top: 25px;
    }

    #result h2 {
      color: #6845c5;
      font-size: 30px;
    }

    footer {
      margin-top: 30px;
      color: #aaa1bc;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="container">
    <span class="label">✨ MINI QUIZ GAME</span>

    <h1>ワクワク！クイズチャレンジ</h1>

    <p class="description">
      君は何問正解できるかな？<br>
      全5問のクイズに挑戦してみよう！
    </p>

    <div class="emoji">🧠🌈</div>

    <button class="main-button" id="startButton" onclick="startQuiz()">
      クイズスタート！
    </button>

    <section id="quiz">
      <div class="progress" id="progress"></div>
      <h2 id="question"></h2>
      <div class="choices" id="choices"></div>
      <div id="feedback" aria-live="polite"></div>
      <button id="nextButton" onclick="nextQuestion()">
        次の問題へ →
      </button>
    </section>

    <section id="result">
      <div class="emoji" id="resultEmoji">🎉</div>
      <h2>クイズ終了！</h2>
      <p id="score"></p>
      <p id="resultMessage"></p>
      <button class="main-button" onclick="startQuiz()">
        もう一度挑戦！
      </button>
    </section>

    <footer>THINK · CHOOSE · HAVE FUN!</footer>
  </main>

  <script>
    const questions = [
      {
        question: "日本の首都はどこ？",
        choices: ["大阪", "東京", "京都", "名古屋"],
        answer: 1,
        explanation: "東京は日本の首都だよ！"
      },
      {
        question: "1年は通常何か月？",
        choices: ["10か月", "11か月", "12か月", "13か月"],
        answer: 2,
        explanation: "1年は12か月。うるう年でも変わらないよ！"
      },
      {
        question: "水が凍る温度は、標準的な気圧で何度？",
        choices: ["0℃", "10℃", "50℃", "100℃"],
        answer: 0,
        explanation: "水は標準的な気圧では0℃で凍るよ！"
      },
      {
        question: "次のうち、哺乳類はどれ？",
        choices: ["ペンギン", "カメ", "イルカ", "カエル"],
        answer: 2,
        explanation: "イルカは肺で呼吸し、子どもに母乳を与える哺乳類だよ！"
      },
      {
        question: "三角形の内角の和は何度？",
        choices: ["90度", "180度", "270度", "360度"],
        answer: 1,
        explanation: "平面上の三角形の内角の和は180度だよ！"
      }
    ];

    let currentQuestion = 0;
    let totalScore = 0;
    let answered = false;

    function startQuiz() {
      currentQuestion = 0;
      totalScore = 0;
      answered = false;

      document.getElementById("startButton").style.display = "none";
      document.getElementById("result").style.display = "none";
      document.getElementById("quiz").style.display = "block";

      showQuestion();
    }

    function showQuestion() {
      answered = false;

      const q = questions[currentQuestion];

      document.getElementById("progress").textContent =
        "QUESTION " + (currentQuestion + 1) + " / " + questions.length;

      document.getElementById("question").textContent = q.question;
      document.getElementById("feedback").textContent = "";
      document.getElementById("nextButton").style.display = "none";

      const choices = document.getElementById("choices");
      choices.innerHTML = "";

      q.choices.forEach((choice, index) => {
        const button = document.createElement("button");
        button.className = "choice";
        button.textContent = ["A", "B", "C", "D"][index] + "　" + choice;
        button.onclick = () => checkAnswer(index, button);
        choices.appendChild(button);
      });
    }

    function checkAnswer(index, selectedButton) {
      if (answered) return;
      answered = true;

      const q = questions[currentQuestion];
      const buttons = document.querySelectorAll(".choice");

      buttons.forEach((button, i) => {
        button.disabled = true;

        if (i === q.answer) {
          button.classList.add("correct");
        }
      });

      const feedback = document.getElementById("feedback");

      if (index === q.answer) {
        totalScore++;
        feedback.textContent = "🎉 正解！\n" + q.explanation;
        feedback.style.color = "#168653";
      } else {
        selectedButton.classList.add("wrong");
        feedback.textContent = "💦 残念！正解は「" +
          q.choices[q.answer] + "」\n" + q.explanation;
        feedback.style.color = "#e34c78";
      }

      const nextButton = document.getElementById("nextButton");
      nextButton.textContent =
        currentQuestion === questions.length - 1
          ? "結果を見る！ 🎊"
          : "次の問題へ →";

      nextButton.style.display = "block";
    }

    function nextQuestion() {
      currentQuestion++;

      if (currentQuestion < questions.length) {
        showQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById("quiz").style.display = "none";
      document.getElementById("result").style.display = "block";

      document.getElementById("score").textContent =
        "あなたの成績は " + totalScore + " / " +
        questions.length + " 問正解！";

      let message;
      let emoji;

      if (totalScore === 5) {
        message = "全問正解！すごすぎる！君はクイズマスター！";
        emoji = "🏆";
      } else if (totalScore >= 3) {
        message = "いい感じ！あと少しでパーフェクト！";
        emoji = "🎉";
      } else {
        message = "挑戦ありがとう！もう一度チャレンジしてみよう！";
        emoji = "🌱";
      }

      document.getElementById("resultMessage").textContent = message;
      document.getElementById("resultEmoji").textContent = emoji;
    }
  </script>
</body>
</html>
